<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>굳있말 말긃</title>
<style>
  :root {
    --bg: #f7f7f9;
    --card: #ffffff;
    --text: #1f2330;
    --muted: #6b7080;
    --border: #d9dce5;
    --accent: #3b5bdb;
    --accent-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181f;
      --card: #20232d;
      --text: #eceef4;
      --muted: #9aa0b4;
      --border: #343848;
      --accent: #748ffc;
      --accent-text: #11131a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  }
  main { max-width: 640px; margin: 0 auto; }
  h1 { text-align: center; margin: 0 0 24px; font-size: 28px; }
  .search { display: flex; gap: 8px; }
  .search input {
    flex: 1;
    padding: 12px 14px;
    font-size: 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    color: var(--text);
  }
  .search input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .search button {
    padding: 12px 22px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: var(--accent-text);
    cursor: pointer;
  }
  .search button:hover { opacity: 0.9; }
  #results {
    margin-top: 24px;
    min-height: 120px;
    padding: 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  #results .placeholder { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>굳있말 말긃</h1>

  <form class="search" id="searchForm">
    <input type="text" id="query" placeholder="검색어를 입력하세요" autocomplete="off">
    <button type="submit" id="searchBtn">찾기</button>
  </form>

  <section id="results" aria-live="polite">
    <span class="placeholder">검색 결과가 여기에 표시됩니다.</span>
  </section>
</main>

<script>
  const form = document.getElementById('searchForm');
  const input = document.getElementById('query');
  const results = document.getElementById('results');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    const q = input.value.trim();
    results.textContent = '';

    if (!q) {
      const p = document.createElement('span');
      p.className = 'placeholder';
      p.textContent = '검색어를 입력해 주세요.';
      results.appendChild(p);
      return;
    }

    // TODO: 여기에 실제 검색 로직을 연결하세요.
    const p = document.createElement('p');
    p.textContent = '“' + q + '” 에 대한 검색 결과가 여기에 표시됩니다.';
    results.appendChild(p);
  });
</script>
</body>
</html>
