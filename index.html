<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>굳있말 말긃</title>
<style>
  :root {
    --bg: #f7f7f9; --card: #ffffff; --text: #1f2330; --muted: #6b7080;
    --border: #d9dce5; --accent: #3b5bdb; --accent-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181f; --card: #20232d; --text: #eceef4; --muted: #9aa0b4;
      --border: #343848; --accent: #748ffc; --accent-text: #11131a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 40px 16px; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  }
  main { max-width: 640px; margin: 0 auto; }
  h1 { text-align: center; margin: 0 0 24px; font-size: 28px; }
  .search { display: flex; gap: 8px; }
  .search input {
    flex: 1; padding: 12px 14px; font-size: 16px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--card); color: var(--text);
  }
  .search input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .search button {
    padding: 12px 22px; font-size: 16px; border: none; border-radius: 8px;
    background: var(--accent); color: var(--accent-text); cursor: pointer;
  }
  .search button:hover { opacity: 0.9; }
  #results {
    margin-top: 24px; min-height: 120px; padding: 16px; background: var(--card);
    border: 1px solid var(--border); border-radius: 8px;
  }
  #results .placeholder { color: var(--muted); }
  #results ul { margin: 0; padding-left: 20px; }
  #results li { margin: 6px 0; }
  #results mark { background: #ffe066; color: #1f2330; border-radius: 3px; padding: 0 2px; }
  #count { margin: 0 0 8px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>굳있말 말긃</h1>

  <form class="search" id="searchForm">
    <input type="text" id="query" placeholder="검색어를 입력하세요" autocomplete="off">
    <button type="submit" id="searchBtn">찾기</button>
  </form>

  <section id="results" aria-live="polite">
    <span class="placeholder">검색 결과가 여기에 표시됩니다.</span>
  </section>
</main>

<script>
  // 검색 대상 데이터 (원하는 내용으로 바꾸세요)
  var DATA = [
    '사과', '바나나', '딸기', '포도', '수박', '참외', '복숭아',
    '자바스크립트', '파이썬', '자바', 'HTML', 'CSS', '리액트',
    '서울', '부산', '대구', '인천', '광주', '대전', '화성'
  ];

  var form = document.getElementById('searchForm');
  var input = document.getElementById('query');
  var results = document.getElementById('results');

  function message(text) {
    results.textContent = '';
    var s = document.createElement('span');
    s.className = 'placeholder';
    s.textContent = text;
    results.appendChild(s);
  }

  function highlight(li, text, q) {
    var lower = text.toLowerCase();
    var qLower = q.toLowerCase();
    var i = lower.indexOf(qLower);
    li.appendChild(document.createTextNode(text.slice(0, i)));
    var m = document.createElement('mark');
    m.textContent = text.slice(i, i + q.length);
    li.appendChild(m);
    li.appendChild(document.createTextNode(text.slice(i + q.length)));
  }

  function search(q) {
    var qLower = q.toLowerCase();
    var found = DATA.filter(function (item) {
      return item.toLowerCase().indexOf(qLower) !== -1;
    });

    if (found.length === 0) {
      message('“' + q + '”에 대한 결과가 없습니다.');
      return;
    }

    results.textContent = '';
    var count = document.createElement('p');
    count.id = 'count';
    count.textContent = found.length + '건 찾았습니다.';
    results.appendChild(count);

    var ul = document.createElement('ul');
    found.forEach(function (item) {
      var li = document.createElement('li');
      highlight(li, item, q);
      ul.appendChild(li);
    });
    results.appendChild(ul);
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var q = input.value.trim();
    if (!q) { message('검색어를 입력해 주세요.'); return; }
    search(q);
  });
</script>
</body>
</html>
