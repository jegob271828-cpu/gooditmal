<!DOCTYPE html>
<html lang="ko">
<head><meta name="naver-site-verification" content="2d559fe5e3d6faa7e6e6042d183dfbb33ad73363" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>굳있말 말긃</title>
<style>
  :root {
    --bg: #f7f7f9; --card: #ffffff; --text: #1f2330; --muted: #6b7080;
    --border: #d9dce5; --accent: #3b5bdb; --accent-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181f; --card: #20232d; --text: #eceef4; --muted: #9aa0b4;
      --border: #343848; --accent: #748ffc; --accent-text: #11131a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 40px 16px; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  }
  main { max-width: 640px; margin: 0 auto; }
  h1 { text-align: center; margin: 0 0 24px; font-size: 28px; }
  .search { display: flex; gap: 8px; }
  .search input {
    flex: 1; padding: 12px 14px; font-size: 16px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--card); color: var(--text);
  }
  .search input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .search button {
    padding: 12px 22px; font-size: 16px; border: none; border-radius: 8px;
    background: var(--accent); color: var(--accent-text); cursor: pointer;
  }
  .search button:hover { opacity: 0.9; }
  #status { margin: 8px 2px 0; color: var(--muted); font-size: 13px; }
  #status.error { color: #e03131; }
  #results {
    margin-top: 16px; min-height: 120px; padding: 16px; background: var(--card);
    border: 1px solid var(--border); border-radius: 8px;
  }
  #results .placeholder { color: var(--muted); }
  #results mark { background: #ffe066; color: #1f2330; border-radius: 3px; padding: 0 2px; }
  #count { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
  .entry { padding: 12px 0; border-top: 1px solid var(--border); }
  .entry:first-of-type { border-top: none; padding-top: 0; }
  .entry h2 { margin: 0 0 6px; font-size: 20px; }
  .entry ol { margin: 0; padding-left: 20px; }
  .entry li { margin: 4px 0; line-height: 1.5; }
  .ref { font-weight: 600; color: var(--accent); margin-right: 6px; }
</style>
</head>
  <section class="about">
  <h2>gooditmal</h2>
  <p>굳있말은 낯바뀌말, 새나말, 이루네말, 땅일로 나뉩니다.</p>
  <ul>
    <li>0이 붙은 단어는 새나말로 바꾼 말입니다.</li>
    <li>1~이 붙은 단어는 낯바뀌말로 바꾼 말입니다.</li>
    <li>이루네말은 사자성어를 뜻합니다.</li>
    <li>땅일은 지명을 의미하며 일부 지명은 제외했습니다.</li>
  </ul>
</section>
<body>
<main>
  <h1>굳있말 말긃</h1>

  <form class="search" id="searchForm">
    <input type="text" id="query" placeholder="검색어를 입력하세요" autocomplete="off">
    <button type="submit" id="searchBtn">찾기</button>
  </form>
  <div id="status">사전을 불러오는 중…</div>

  <section id="results" aria-live="polite">
    <span class="placeholder">검색 결과가 여기에 표시됩니다.</span>
  </section>
</main>

<script>
  var ENTRIES = [];
  var loaded = false;

  var form = document.getElementById('searchForm');
  var input = document.getElementById('query');
  var results = document.getElementById('results');
  var statusEl = document.getElementById('status');

  function norm(s) {
    return String(s == null ? '' : s).normalize('NFC').toLowerCase();
  }

  function setStatus(text, isError) {
    statusEl.textContent = text;
    statusEl.className = isError ? 'error' : '';
  }

  function message(text) {
    results.textContent = '';
    var s = document.createElement('span');
    s.className = 'placeholder';
    s.textContent = text;
    results.appendChild(s);
  }

  // text를 parent에 넣되, q와 일치하는 부분은 <mark>로 강조
  function appendHighlighted(parent, text, q) {
    text = String(text);
    var i = norm(text).indexOf(norm(q));
    if (i === -1) {
      parent.appendChild(document.createTextNode(text));
      return;
    }
    parent.appendChild(document.createTextNode(text.slice(0, i)));
    var m = document.createElement('mark');
    m.textContent = text.slice(i, i + q.length);
    parent.appendChild(m);
    parent.appendChild(document.createTextNode(text.slice(i + q.length)));
  }

  // 표제어 또는 대응 단어에 검색어가 들어 있으면 일치
  function matches(entry, q) {
    var nq = norm(q);
    if (norm(entry.word).indexOf(nq) !== -1) return true;
    return entry.senses.some(function (s) {
      return norm(s.refWord).indexOf(nq) !== -1;
    });
  }

  function search(q) {
    var found = ENTRIES.filter(function (e) { return matches(e, q); });

    if (found.length === 0) {
      message('“' + q + '”에 대한 결과가 없습니다.');
      return;
    }

    results.textContent = '';
    var count = document.createElement('p');
    count.id = 'count';
    count.textContent = found.length + '건 찾았습니다.';
    results.appendChild(count);

    found.forEach(function (entry) {
      var box = document.createElement('div');
      box.className = 'entry';

      var h = document.createElement('h2');
      appendHighlighted(h, entry.word, q);
      box.appendChild(h);

      var ol = document.createElement('ol');
      entry.senses.forEach(function (sense) {
        var li = document.createElement('li');
        var ref = document.createElement('span');
        ref.className = 'ref';
        var label = sense.refWord + (sense.homonymNo != null ? sense.homonymNo : '');
        appendHighlighted(ref, label, q);
        li.appendChild(ref);
        li.appendChild(document.createTextNode(sense.definition || ''));
        ol.appendChild(li);
      });
      box.appendChild(ol);

      results.appendChild(box);
    });
  }

  function runSearch() {
    var q = input.value.trim();
    if (!q) { message('검색어를 입력해 주세요.'); return; }
    if (!loaded) { message('사전을 불러오는 중입니다. 잠시 후 다시 시도해 주세요.'); return; }
    search(q);
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    runSearch();
  });

  // 여러 형식의 JSON을 모두 받아들입니다.
  //  1) {"entries":[{word, senses:[{refWord, homonymNo, definition}]}]}
  //  2) [{word, senses:[...]}]
  //  3) {"남":["나무"], ...}
  function toEntries(d) {
    var list = null;
    if (Array.isArray(d)) list = d;
    else if (d && Array.isArray(d.entries)) list = d.entries;

    if (list) {
      return list.filter(function (e) {
        return e && e.word != null && Array.isArray(e.senses);
      });
    }

    if (d && typeof d === 'object') {
      return Object.keys(d).map(function (k) {
        var v = Array.isArray(d[k]) ? d[k] : [d[k]];
        return {
          word: k,
          senses: v.map(function (x) {
            return { refWord: String(x), homonymNo: null, definition: '' };
          })
        };
      });
    }
    return [];
  }

  // ───────── 사전 파일 불러오기 ─────────
  // 기본 파일: words.json (필수)
  // 추가 파일: words_01.json ~ words_30.json 중 존재하는 것을 자동으로 모두 불러옵니다.
  //            새 파일을 같은 폴더에 올리기만 하면 되고, 번호를 건너뛰어도 됩니다.
  //            30개를 넘기려면 MAX_EXTRA 숫자만 늘리세요.
  var MAIN_FILE = 'words.json';
  var MAX_EXTRA = 99;

  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  // 파일 하나를 불러옵니다. 없으면(404) { missing: true }, 형식 오류면 { error: ... }
  function loadFile(name) {
    return fetch(name + '?v=' + Date.now(), { cache: 'no-store' })
      .then(function (r) {
        if (r.status === 404) return { name: name, missing: true };
        if (!r.ok) return { name: name, error: 'HTTP ' + r.status };
        return r.text().then(function (t) {
          try {
            return { name: name, data: JSON.parse(t) };
          } catch (e) {
            return { name: name, error: 'JSON 형식 오류: ' + e.message };
          }
        });
      })
      .catch(function (err) {
        return { name: name, error: String(err.message || err) };
      });
  }

  var names = [MAIN_FILE];
  for (var i = 1; i <= MAX_EXTRA; i++) names.push('words_' + pad2(i) + '.json');

  Promise.all(names.map(loadFile)).then(function (files) {
    var main = files[0];
    if (main.missing || main.error) {
      throw new Error(MAIN_FILE + ' 불러오기 실패' + (main.error ? ' (' + main.error + ')' : ' (파일 없음)'));
    }

    var byWord = {};
    var merged = [];
    var okNames = [];
    var problems = [];

    files.forEach(function (f) {
      if (f.missing) return;
      if (f.error) { problems.push(f.name + ': ' + f.error); return; }
      var list = toEntries(f.data);
      if (list.length === 0) { problems.push(f.name + ': 단어를 찾지 못했습니다'); return; }
      okNames.push(f.name);
      list.forEach(function (e) {
        var key = norm(e.word);
        if (byWord[key]) {
          // 같은 표제어가 여러 파일에 있으면 뜻을 합칩니다.
          byWord[key].senses = byWord[key].senses.concat(e.senses);
        } else {
          byWord[key] = { word: e.word, senses: e.senses.slice() };
          merged.push(byWord[key]);
        }
      });
    });

    ENTRIES = merged;
    if (ENTRIES.length === 0) {
      throw new Error(MAIN_FILE + '에서 단어를 찾지 못했습니다. 파일 내용을 확인해 주세요.');
    }
    loaded = true;
    console.log('불러온 파일:', okNames.join(', '), '/ 단어 수:', ENTRIES.length);
    if (problems.length) {
      console.warn('문제가 있는 파일:', problems);
      setStatus('일부 파일을 불러오지 못했습니다 → ' + problems.join(' / '), true);
    } else {
      setStatus('', false);
    }
    if (input.value.trim()) runSearch();
  }).catch(function (err) {
    console.error('사전 로드 실패:', err);
    setStatus('불러오기 실패: ' + err.message, true);
    message('사전을 불러오지 못했습니다. 위의 빨간 글씨를 확인해 주세요.');
  });
</script>
</body>
</html>
