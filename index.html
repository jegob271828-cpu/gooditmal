<!DOCTYPE html>
<html lang="ko">
<head><meta name="naver-site-verification" content="2d559fe5e3d6faa7e6e6042d183dfbb33ad73363" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>굳있말 말긃</title>
<style>
  :root {
    --bg: #f7f7f9; --card: #ffffff; --text: #1f2330; --muted: #6b7080;
    --border: #d9dce5; --accent: #3b5bdb; --accent-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181f; --card: #20232d; --text: #eceef4; --muted: #9aa0b4;
      --border: #343848; --accent: #748ffc; --accent-text: #11131a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 40px 16px; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  }
  main { max-width: 640px; margin: 0 auto; }
  h1 { text-align: center; margin: 0 0 24px; font-size: 28px; }
  .search { display: flex; gap: 8px; }
  .search input {
    flex: 1; padding: 12px 14px; font-size: 16px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--card); color: var(--text);
  }
  .search input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .search button {
    padding: 12px 22px; font-size: 16px; border: none; border-radius: 8px;
    background: var(--accent); color: var(--accent-text); cursor: pointer;
  }
  .search button:hover { opacity: 0.9; }
  #results {
    margin-top: 24px; min-height: 120px; padding: 16px; background: var(--card);
    border: 1px solid var(--border); border-radius: 8px;
  }
  #results .placeholder { color: var(--muted); }
  #results mark { background: #ffe066; color: #1f2330; border-radius: 3px; padding: 0 2px; }
  #count { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
  .entry { padding: 12px 0; border-top: 1px solid var(--border); }
  .entry:first-of-type { border-top: none; padding-top: 0; }
  .entry h2 { margin: 0 0 6px; font-size: 20px; }
  .entry ol { margin: 0; padding-left: 20px; }
  .entry li { margin: 4px 0; line-height: 1.5; }
  .ref { font-weight: 600; color: var(--accent); margin-right: 6px; }
</style>
</head>
<body>
<main>
  <h1>굳있말 말긃</h1>

  <form class="search" id="searchForm">
    <input type="text" id="query" placeholder="검색어를 입력하세요" autocomplete="off">
    <button type="submit" id="searchBtn">찾기</button>
  </form>

  <section id="results" aria-live="polite">
    <span class="placeholder">검색 결과가 여기에 표시됩니다.</span>
  </section>
</main>

<script>
  var ENTRIES = [];
  var loaded = false;

  var form = document.getElementById('searchForm');
  var input = document.getElementById('query');
  var results = document.getElementById('results');

  function norm(s) {
    return String(s).normalize('NFC').toLowerCase();
  }

  function message(text) {
    results.textContent = '';
    var s = document.createElement('span');
    s.className = 'placeholder';
    s.textContent = text;
    results.appendChild(s);
  }

  // text를 parent에 넣되, q와 일치하는 부분은 <mark>로 강조
  function appendHighlighted(parent, text, q) {
    var i = norm(text).indexOf(norm(q));
    if (i === -1) {
      parent.appendChild(document.createTextNode(text));
      return;
    }
    parent.appendChild(document.createTextNode(text.slice(0, i)));
    var m = document.createElement('mark');
    m.textContent = text.slice(i, i + q.length);
    parent.appendChild(m);
    parent.appendChild(document.createTextNode(text.slice(i + q.length)));
  }

  // 표제어 또는 대응 단어(분량, 역량 등)에 검색어가 들어 있으면 일치
  function matches(entry, q) {
    var nq = norm(q);
    if (norm(entry.word).indexOf(nq) !== -1) return true;
    return entry.senses.some(function (s) {
      return norm(s.refWord).indexOf(nq) !== -1;
    });
  }

  function search(q) {
    var found = ENTRIES.filter(function (e) { return matches(e, q); });

    if (found.length === 0) {
      message('“' + q + '”에 대한 결과가 없습니다.');
      return;
    }

    results.textContent = '';
    var count = document.createElement('p');
    count.id = 'count';
    count.textContent = found.length + '건 찾았습니다.';
    results.appendChild(count);

    found.forEach(function (entry) {
      var box = document.createElement('div');
      box.className = 'entry';

      var h = document.createElement('h2');
      appendHighlighted(h, entry.word, q);
      box.appendChild(h);

      var ol = document.createElement('ol');
      entry.senses.forEach(function (sense) {
        var li = document.createElement('li');
        var ref = document.createElement('span');
        ref.className = 'ref';
        var label = sense.refWord + (sense.homonymNo != null ? sense.homonymNo : '');
        appendHighlighted(ref, label, q);
        li.appendChild(ref);
        li.appendChild(document.createTextNode(sense.definition));
        ol.appendChild(li);
      });
      box.appendChild(ol);

      results.appendChild(box);
    });
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var q = input.value.trim();
    if (!q) { message('검색어를 입력해 주세요.'); return; }
    if (!loaded) { message('사전을 불러오는 중입니다. 잠시 후 다시 시도해 주세요.'); return; }
    search(q);
  });

  // words.json 불러오기 (index.html과 같은 폴더에 있어야 합니다)
  fetch('words.json')
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (d) {
      ENTRIES = d.entries || [];
      loaded = true;
    })
    .catch(function (err) {
      console.error('words.json 로드 실패:', err);
      message('words.json을 불러오지 못했습니다. 파일 위치와 이름을 확인해 주세요.');
    });
</script>
</body>
</html>
